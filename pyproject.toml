[project]
name = "niftsy"
version = "0.1.0"
description = "Generate synthetic tabular datasets with LLM-generated, context-consistent free-text columns"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
local  = ["vllm>=0.15,<0.16", "torch"]
gemini = [
    "google-genai>=1.30",
]
openai = [
    "openai>=1.0",
]
all    = ["vllm>=0.15,<0.16", "torch", "google-genai>=1.30", "openai>=1.0"]

[project.scripts]
niftsy = "niftsy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
