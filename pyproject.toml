[project]
name = "niftsy"
version = "0.1.0"
description = "Generate synthetic tabular datasets with LLM-generated, context-consistent free-text columns"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-genai>=2.17.0",
    # Capped below 1.0 -- 1.29.0 changed GatedRepoError/RepositoryNotFoundError's
    # constructor signature (now requires a keyword-only `response=`), breaking
    # the local_vllm error-translation tests, which construct these directly.
    "huggingface-hub>=0.36.2,<1.0",
    "numpy>=2.2.6",
    "openai>=2.53.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tqdm>=4.70.0",
]

# torch/vllm are Linux + CUDA-GPU only (no wheel for macOS/Windows), and are
# capped to the exact minor version verified working on tested hardware --
# an unbounded torch install pulled 2.13.0 in testing, which requires a
# newer CUDA driver than a tested machine's (570.211.01 / CUDA 12.8) and
# broke local generation with a driver-version error at engine init. Kept as
# an optional extra so Gemini/OpenAI-only users on any platform can install
# without them: `uv sync --extra local`.
[project.optional-dependencies]
local = [
    "torch>=2.9.1,<2.10",
    "vllm>=0.15.1,<0.16",
]

[project.scripts]
niftsy = "niftsy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# Correctness (pyflakes) + basic pycodestyle errors + import sorting.
# Deliberately not the extended security/style families (S, BLE, TRY, FURB,
# PLW, ...) -- v0.1 guardrails, not a lint-hardening project.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# pandas/pyyaml/tqdm/scipy don't ship (or we don't install) type stubs --
# not worth an extra stub-package dependency for v0.1.
ignore_missing_imports = true
