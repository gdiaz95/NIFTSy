[project]
name = "niftsy"
version = "0.1.0"
description = "Generate synthetic tabular datasets with LLM-generated, context-consistent free-text columns"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-genai>=2.17.0",
    "numpy>=2.2.6",
    "openai>=2.53.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "torch>=2.9.1",
    "tqdm>=4.70.0",
    "vllm>=0.15.1",
]

[project.scripts]
niftsy = "niftsy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
